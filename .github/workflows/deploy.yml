name: Trigger auto deployment for containerapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: acresimfans01.azurecr.io
          username: ${{ secrets.ACRESIMFANS01_AZURECR_IO_USERNAME }}
          password: ${{ secrets.ACRESIMFANS01_AZURECR_IO_PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: acresimfans01.azurecr.io/esimfansdev:${{ github.sha }}
          file: ./Dockerfile

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: container-app-1abf
          resourceGroup: rg-d0f7
          imageToDeploy: acresimfans01.azurecr.io/esimfansdev:${{ github.sha }}

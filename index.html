<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // En entornos de previsualización aislados (sandbox / iframe), Vite HMR no utiliza websockets persistentes.
      // Este capturador evita que las desconexiones benignas de WebSocket muestren avisos no deseados de 'Unhandled Rejection'.
      (function() {
        function isWsError(err) {
          if (!err) return false;
          var str = typeof err === 'string' ? err : (err.message || (err.reason && err.reason.message) || err.toString() || '');
          return /websocket|closed without opened|failed to connect to websocket|\[vite\].*connecting|\[vite\].*failed/i.test(str);
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isWsError(event.message) || (event.error && isWsError(event.error))) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
        var origWarn = console.warn;
        var origError = console.error;
        console.warn = function() {
          var msg = Array.prototype.slice.call(arguments).map(function(a) { return typeof a === 'string' ? a : (a && a.message) || ''; }).join(' ');
          if (isWsError(msg)) return;
          origWarn.apply(console, arguments);
        };
        console.error = function() {
          var msg = Array.prototype.slice.call(arguments).map(function(a) { return typeof a === 'string' ? a : (a && a.message) || ''; }).join(' ');
          if (isWsError(msg)) return;
          origError.apply(console, arguments);
        };
      })();
    </script>
    <title>eSIM Global - Planes de Datos y Códigos QR de Conectividad</title>

  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans transition-colors duration-200">
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('esim_app_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
